# Server Port for API Gateway
server.port=8080
spring.application.name=apigateway

# Eureka Registration & Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Spring Cloud Gateway Route Rules
# 1. Auth Service Route (Port 8084)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://JWTAUTHENTICATIONSERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/login,/validate

# 2. Component Processing Service Route (Port 8081)
spring.cloud.gateway.routes[1].id=component-processing-service
spring.cloud.gateway.routes[1].uri=lb://COMPONENTPROCESSINGSERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/service,/payment/**

# 3. Packaging & Delivery Service Route (Port 8082)
spring.cloud.gateway.routes[2].id=packaging-delivery-service
spring.cloud.gateway.routes[2].uri=lb://PACKAGINGANDDELIVERYSERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/PackagingAndDeliveryCharge/**

# 4. Payment Service Route (Port 8083)
spring.cloud.gateway.routes[3].id=payment-service
spring.cloud.gateway.routes[3].uri=lb://PAYMENTSERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/card/**,/api/v1/payments/**

# Global CORS Configuration for React SPA (Port 5173)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true