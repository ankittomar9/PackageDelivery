# Server Port
server.port=8081

# Application Name
spring.application.name=componentprocessingservice
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:componentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Externalized Downstream Microservice URLs for OpenFeign Clients
auth.service.url=http://localhost:8084
packaging.service.url=http://localhost:8082
payment.service.url=http://localhost:8083

# Actuator Health Check Endpoints
#management.endpoints.web.exposure.include=health,info
#management.endpoint.health.show-details=always

# Disable Spring Cloud Discovery Client until Eureka Server is added
#spring.cloud.discovery.enabled=false