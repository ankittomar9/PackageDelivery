# Server Port
server.port=8084

# Application Name
spring.application.name=jwtauthenticationservice

# Eureka Registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.enabled=true
eureka.instance.prefer-ip-address=true

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Web Console (Accessible at http://localhost:8084/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CRITICAL FOR SPRING BOOT 3+: Defer data.sql initialization until Hibernate creates tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT Configuration (32+ character secret key for HMAC-SHA256)
jwt.secret=defaultSuperSecretKeyForReturnOrderManagementSystem2026!
jwt.expiration.ms=1800000

# Expose Spring Boot Actuator Endpoints for Docker HEALTHCHECK
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


