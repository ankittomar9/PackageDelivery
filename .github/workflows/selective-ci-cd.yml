name: Selective Microservices CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'jwtAuthentication/**'
      - 'componentprocessingservice/**'
      - 'packaginganddeliveryservice/**'
      - 'paymentservice/**'
      - 'apigateway/**'
      - 'eurekaserver/**'
      - 'webportal/**'

jobs:
  detect-changes:
    name: Detect Modified Microservices
    runs-on: ubuntu-latest
    outputs:
      jwtAuth: ${{ steps.filter.outputs.jwtAuth }}
      componentProcessing: ${{ steps.filter.outputs.componentProcessing }}
      packagingDelivery: ${{ steps.filter.outputs.packagingDelivery }}
      paymentService: ${{ steps.filter.outputs.paymentService }}
      apiGateway: ${{ steps.filter.outputs.apiGateway }}
      eurekaServer: ${{ steps.filter.outputs.eurekaServer }}
      webPortal: ${{ steps.filter.outputs.webPortal }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            jwtAuth: 'jwtAuthentication/**'
            componentProcessing: 'componentprocessingservice/**'
            packagingDelivery: 'packaginganddeliveryservice/**'
            paymentService: 'paymentservice/**'
            apiGateway: 'apigateway/**'
            eurekaServer: 'eurekaserver/**'
            webPortal: 'webportal/**'

  build-jwt-auth:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.jwtAuth == 'true' }}
    name: Build & Test jwtAuthentication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run Maven Tests
        run: |
          cd jwtAuthentication
          mvn clean test
      - name: Build Docker Container
        run: |
          cd jwtAuthentication
          docker build -t ghcr.io/${{ github.repository_owner }}/jwtauthenticationservice:latest .

  build-component-processing:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.componentProcessing == 'true' }}
    name: Build & Test ComponentProcessing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run Maven Tests
        run: |
          cd componentprocessingservice
          mvn clean test
      - name: Build Docker Container
        run: |
          cd componentprocessingservice
          docker build -t ghcr.io/${{ github.repository_owner }}/componentprocessingservice:latest .

  build-packaging-delivery:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.packagingDelivery == 'true' }}
    name: Build & Test PackagingAndDelivery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run Maven Tests
        run: |
          cd packaginganddeliveryservice
          mvn clean test
      - name: Build Docker Container
        run: |
          cd packaginganddeliveryservice
          docker build -t ghcr.io/${{ github.repository_owner }}/packaginganddeliveryservice:latest .

  build-payment-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.paymentService == 'true' }}
    name: Build & Test PaymentService
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run Maven Tests
        run: |
          cd paymentservice
          mvn clean test
      - name: Build Docker Container
        run: |
          cd paymentservice
          docker build -t ghcr.io/${{ github.repository_owner }}/paymentservice:latest .

  build-web-portal:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.webPortal == 'true' }}
    name: Build React WebPortal SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & Build React Bundle
        run: |
          cd webportal
          npm ci
          npm run build
